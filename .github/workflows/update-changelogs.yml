name: Update product changelogs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write       # Push only the reserved automation branch, never master.
  pull-requests: write  # Create/update the bot PR and apply product:none.
  actions: write        # Explicitly dispatch its required checks and CI.

concurrency:
  group: release-changelog-writer
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Create or update the generated changelog PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/update-changelogs.mjs
