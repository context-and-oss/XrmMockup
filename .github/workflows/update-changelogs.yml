name: Update product changelogs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-changelog-writer
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
    steps:
      - name: Require the narrowly scoped changelog writer identity
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_APP_ID" ]; then
            if [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
              echo 'RELEASE_APP_ID requires RELEASE_APP_PRIVATE_KEY. See RELEASE.md.' >&2
              exit 1
            fi
          elif [ -z "$RELEASE_BOT_TOKEN" ]; then
            echo 'Configure the release GitHub App or RELEASE_BOT_TOKEN with scoped master bypass. See RELEASE.md.' >&2
            exit 1
          fi
      - name: Create a short-lived token for the changelog writer
        if: env.RELEASE_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_BOT_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Reconcile merged PRs and successful release history
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_BOT_TOKEN }}
        run: node scripts/release/update-changelogs.mjs
