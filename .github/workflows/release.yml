name: Release

on:
  push:
    tags: ['core-v*', 'metadata-v*']
  workflow_dispatch:
    inputs:
      product:
        description: Product to preview or release
        type: choice
        options: [core, metadata]
        required: true
      version:
        description: Semantic version without a v prefix
        type: string
        required: true
      source_ref:
        description: Source with merged changelog updates (publishing requires a matching tag)
        type: string
        required: true
      dry_run:
        description: Build only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-product-${{ inputs.product || (startsWith(github.ref_name, 'metadata-v') && 'metadata' || 'core') }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: release-source
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      dry_run: ${{ steps.prepare.outputs.dry_run }}
    steps:
      - name: Check out trusted release scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-tools
          persist-credentials: false
      - name: Check out requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve tag and verify changelog
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node ../release-tools/scripts/release/prepare-release.mjs
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
      - name: Build, test, and pack the selected product
        shell: pwsh
        env:
          PACK_PROJECT: ${{ steps.prepare.outputs.project }}
        run: |
          $props = (Resolve-Path '.release/version.props').Path
          dotnet restore "-p:ReleaseBuildProps=$props"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build --configuration Release --no-restore "-p:ReleaseBuildProps=$props"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --configuration Release --no-build --verbosity normal "-p:ReleaseBuildProps=$props"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack $env:PACK_PROJECT --configuration Release --no-build --output .release/packages "-p:ReleaseBuildProps=$props"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate package ID and version
        shell: pwsh
        run: '& ../release-tools/scripts/release/validate-packages.ps1'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.prepare.outputs.tag }}
          path: release-source/.release/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: .release/
      - name: Validate package and tag
        shell: pwsh
        run: '& ./scripts/release/validate-packages.ps1'
      - name: Log in to NuGet
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the selected package and its symbols
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $package = Get-ChildItem '.release/packages/*.nupkg' -File
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create GitHub release and update changelog PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-release.mjs
