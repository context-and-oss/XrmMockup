name: Set up release labels
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Provision configured labels
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config = Get-Content scripts/release/config.json -Raw | ConvertFrom-Json -AsHashtable
          $labels = @('product:core', 'product:metadata', 'product:none') + @($config.categories.Keys)
          foreach ($label in $labels) {
            gh label create $label --color 5319e7 --description 'Release classification' --force --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
