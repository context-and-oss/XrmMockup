name: Release automation tests

on:
  pull_request:
    paths:
      - 'scripts/release/**'
      - '.github/workflows/**'
      - 'scripts/Pack-Local.ps1'
      - 'Directory.Build.props'
      - 'src/MetadataGen/Directory.Build.props'
      - 'src/MetadataGen/MetadataGenerator.Tool/MetadataGenerator.Tool.csproj'
      - 'src/XrmMockup365/XrmMockup365.csproj'
  push:
    branches: [master]
    paths:
      - 'scripts/release/**'
      - '.github/workflows/**'
      - 'scripts/Pack-Local.ps1'
      - 'Directory.Build.props'
      - 'src/MetadataGen/Directory.Build.props'
      - 'src/MetadataGen/MetadataGenerator.Tool/MetadataGenerator.Tool.csproj'
      - 'src/XrmMockup365/XrmMockup365.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Release automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test release policy and orchestration
        run: node --test scripts/release/*.test.mjs
