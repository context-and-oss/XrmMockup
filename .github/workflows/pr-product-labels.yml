name: Validate PR products

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to validate using trusted metadata-only code
        required: true
        type: string
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-products-${{ github.event.pull_request.number || inputs.pr_number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Publish product classification check
    runs-on: ubuntu-latest
    steps:
      # Metadata only: always use trusted default-branch scripts, never PR-head code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate and report against the PR/merge-group head SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/check-pr.mjs product
