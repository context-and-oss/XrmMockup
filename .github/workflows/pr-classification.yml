name: Validate PR release labels

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate metadata and report both required checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: ./scripts/release/Check-Pr.ps1 -PrNumber $env:PR_NUMBER
