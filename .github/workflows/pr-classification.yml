name: Validate PR release labels

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR release labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate PR release labels
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
        run: ./scripts/release/Check-Pr.ps1 -PrNumber $env:PR_NUMBER -ExpectedHeadSha $env:EXPECTED_HEAD_SHA
